<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chainbook</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes barGrow { from { width: 0; } }
        @keyframes iconEntry {
            0%   { opacity: 0; transform: scale(0.7); }
            60%  { opacity: 1; transform: scale(1.04); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes dotBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }
        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'DejaVu Sans', Arial, sans-serif;
            overflow: hidden;
            background: #0f0520;
        }

        #loading {
            position: fixed; inset: 0;
            background: linear-gradient(160deg, #1a0a2e 0%, #0f0520 40%, #16082b 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: #fff; z-index: 9999;
        }

        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(124, 58, 237, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124, 58, 237, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .bg-glow {
            position: absolute;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.12) 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .brand {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
        }

        .brand-icon {
            width: 72px; height: 72px;
            animation: iconEntry 0.6s ease-out both;
            filter: drop-shadow(0 0 24px rgba(124, 58, 237, 0.35));
        }

        .brand-name {
            margin-top: 20px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #fff;
            animation: fadeIn 0.5s ease-out 0.3s both;
        }

        .brand-sub {
            margin-top: 4px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(167, 139, 250, 0.7);
            animation: fadeIn 0.5s ease-out 0.45s both;
        }

        .progress-area {
            margin-top: 48px;
            width: 260px;
            animation: fadeIn 0.5s ease-out 0.6s both;
            position: relative; z-index: 1;
        }

        .progress-track {
            width: 100%; height: 3px;
            background: rgba(124, 58, 237, 0.15);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, #7c3aed, #a78bfa, #7c3aed);
            background-size: 200% 100%;
            animation: shimmer 2s linear infinite, barGrow 0.4s ease-out;
            width: 0%;
            transition: width 0.6s ease-out;
        }

        .status-text {
            margin-top: 16px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
            letter-spacing: 0.02em;
            min-height: 16px;
        }

        .status-text .dot {
            display: inline-block;
            animation: dotBounce 1.2s ease-in-out infinite;
        }
        .status-text .dot:nth-child(2) { animation-delay: 0.15s; }
        .status-text .dot:nth-child(3) { animation-delay: 0.3s; }

        .services {
            margin-top: 28px;
            display: flex; gap: 6px;
            animation: fadeIn 0.5s ease-out 0.8s both;
            position: relative; z-index: 1;
        }

        .svc-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.2);
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        .svc-dot.active {
            background: #7c3aed;
            box-shadow: 0 0 8px rgba(124, 58, 237, 0.5);
        }

        #error {
            display: none; position: fixed; inset: 0;
            background: linear-gradient(160deg, #1a0a2e 0%, #0f0520 40%, #16082b 100%);
            flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; text-align: center; z-index: 10000;
        }

        .err-icon {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #ef4444;
            margin-bottom: 20px;
        }

        #error h2 {
            font-size: 18px; font-weight: 700;
            color: #fff; margin-bottom: 8px;
        }

        #error p {
            font-size: 12px; color: rgba(255, 255, 255, 0.5);
            max-width: 320px; line-height: 1.6;
            margin-bottom: 28px;
        }

        .retry-btn {
            padding: 10px 32px;
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
            letter-spacing: 0.02em;
        }

        .retry-btn:hover { background: #6d28d9; }
        .retry-btn:active { background: #5b21b6; }

        .version {
            position: absolute;
            bottom: 20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.04em;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>

        <div class="brand">
            <!-- Inline SVG approximation of the Chainbook icon -->
            <svg class="brand-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" fill="#7c3aed"/>
                <!-- Top two curved lines -->
                <path d="M22 28 C22 28, 30 22, 50 22 C70 22, 78 28, 78 28" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
                <path d="M22 40 C22 40, 30 34, 50 34 C70 34, 78 40, 78 40" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
                <!-- Left curved vertical -->
                <path d="M22 28 C18 35, 18 55, 22 72" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
                <!-- Bottom rectangle shape -->
                <rect x="30" y="52" width="44" height="16" rx="4" fill="#fff"/>
                <!-- Right curve -->
                <path d="M74 40 C78 47, 78 60, 74 68" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
            </svg>

            <div class="brand-name">Chainbook</div>
            <div class="brand-sub">Intelligence</div>
        </div>

        <div class="progress-area">
            <div class="progress-track">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="status-text" id="status-text">
                Initializing<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
            </div>
        </div>

        <div class="services">
            <div class="svc-dot" id="svc-0" title="Database"></div>
            <div class="svc-dot" id="svc-1" title="Search"></div>
            <div class="svc-dot" id="svc-2" title="Server"></div>
            <div class="svc-dot" id="svc-3" title="Queue"></div>
            <div class="svc-dot" id="svc-4" title="WebSocket"></div>
            <div class="svc-dot" id="svc-5" title="Workers"></div>
        </div>

        <div class="version">v0.1.0</div>
    </div>

    <div id="error">
        <div class="bg-grid"></div>
        <div class="err-icon">!</div>
        <h2>Unable to Start</h2>
        <p>The application services could not be initialized. Please check your installation or try restarting.</p>
        <button class="retry-btn" onclick="location.reload()">Retry</button>
        <div class="version">v0.1.0</div>
    </div>

    <script>
        var SERVER_URL = 'http://127.0.0.1:8080';
        var MAX_RETRIES = 90;
        var retryCount = 0;
        var svcIndex = 0;

        var stages = [
            { msg: 'Starting database',        pct: 10 },
            { msg: 'Starting search engine',    pct: 25 },
            { msg: 'Starting web server',       pct: 45 },
            { msg: 'Starting queue workers',    pct: 60 },
            { msg: 'Starting WebSocket server', pct: 75 },
            { msg: 'Loading application',       pct: 90 },
        ];

        var bar = document.getElementById('progress-bar');
        var statusEl = document.getElementById('status-text');

        function setStage(index) {
            if (index >= stages.length) return;
            var s = stages[index];
            bar.style.width = s.pct + '%';
            statusEl.innerHTML = s.msg + '<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
        }

        function activateDot() {
            if (svcIndex < 6) {
                document.getElementById('svc-' + svcIndex).classList.add('active');
                svcIndex++;
            }
        }

        function checkServer() {
            var xhr = new XMLHttpRequest();
            xhr.timeout = 3000;
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status > 0) {
                        bar.style.width = '100%';
                        statusEl.innerHTML = 'Ready';
                        for (var i = 0; i < 6; i++) {
                            document.getElementById('svc-' + i).classList.add('active');
                        }
                        setTimeout(function() {
                            window.location.replace(SERVER_URL);
                        }, 400);
                    } else {
                        retryFailed();
                    }
                }
            };
            xhr.onerror = function() { retryFailed(); };
            xhr.ontimeout = function() { retryFailed(); };
            try {
                xhr.open('HEAD', SERVER_URL, true);
                xhr.send();
            } catch(e) {
                retryFailed();
            }
        }

        function retryFailed() {
            retryCount++;
            var stageIdx = Math.min(Math.floor(retryCount / 12), stages.length - 1);
            setStage(stageIdx);
            if (retryCount % 12 === 0) activateDot();
            if (retryCount >= MAX_RETRIES) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'flex';
            } else {
                setTimeout(checkServer, 1000);
            }
        }

        setTimeout(function() {
            setStage(0);
            checkServer();
        }, 800);
    </script>
</body>
</html>
