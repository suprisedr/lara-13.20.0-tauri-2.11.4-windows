version: '3'

rpc:
    listen: 'tcp://127.0.0.1:6001'

server:
    command: 'php grpc_worker.php'
    relay: pipes

grpc:
    listen: 'tcp://127.0.0.1:9001'
    proto:
        - 'proto/auth.proto'
        - 'proto/company.proto'
        - 'proto/transactions.proto'
        - 'proto/assets.proto'
        - 'proto/leases.proto'
        - 'proto/inventory.proto'
        - 'proto/intangibles.proto'
        - 'proto/invoices.proto'
    pool:
        num_workers: 4
        max_jobs: 64
        supervisor:
            max_worker_memory: 128

jobs:
    pool:
        command: 'php jobs_worker.php'
        num_workers: 4
        max_worker_memory: 256
    pipelines:
        embeddings:
            driver: memory
            config:
                priority: 10
                prefetch: 10
        asset-postings:
            driver: memory
            config:
                priority: 5
                prefetch: 4
        intangible-postings:
            driver: memory
            config:
                priority: 5
                prefetch: 4
        inventory-postings:
            driver: memory
            config:
                priority: 5
                prefetch: 4
        lease-postings:
            driver: memory
            config:
                priority: 5
                prefetch: 4
        ecl-postings:
            driver: memory
            config:
                priority: 5
                prefetch: 4
        credit-note-postings:
            driver: memory
            config:
                priority: 5
                prefetch: 4
        invoice-postings:
            driver: memory
            config:
                priority: 5
                prefetch: 4
        biological-asset-postings:
            driver: memory
            config:
                priority: 5
                prefetch: 4
        investment-property-postings:
            driver: memory
            config:
                priority: 5
                prefetch: 4
        chart-of-accounts:
            driver: memory
            config:
                priority: 3
                prefetch: 2
        default:
            driver: memory
            config:
                priority: 1
                prefetch: 2
    consume:
        - embeddings
        - asset-postings
        - intangible-postings
        - inventory-postings
        - lease-postings
        - ecl-postings
        - credit-note-postings
        - invoice-postings
        - biological-asset-postings
        - investment-property-postings
        - chart-of-accounts
        - default

temporal:
    address: '127.0.0.1:7233'
    activities:
        command: 'php temporal_worker.php'
        num_workers: 1
        max_jobs: 64
        supervisor:
            max_worker_memory: 256

service:
    email_listener:
        command: 'php artisan emails:listen'
        process_num: 1
        remain_after_exit: true
        restart_sec: 10

kv:
    local:
        driver: memory
        config:
            interval: 60

logs:
    mode: development
    level: info
